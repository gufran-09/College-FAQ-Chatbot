# ── PostgreSQL ──────────────────────────────────────────────
# Use environment variables for anything sensitive before pushing to GitHub.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/college_chatbot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create / update tables from JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Gemini ──────────────────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.embedding.url=${GEMINI_EMBEDDING_URL:https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent}
gemini.chat.url=${GEMINI_CHAT_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}

# ── ChromaDB ────────────────────────────────────────────────
# ChromaDB runs locally via Docker on port 8000
chromadb.base.url=${CHROMADB_BASE_URL:http://localhost:8000}
chromadb.collection.name=${CHROMADB_COLLECTION_NAME:college_docs}
chromadb.tenant=${CHROMADB_TENANT:default_tenant}
chromadb.database=${CHROMADB_DATABASE:default_database}

# ── File upload size limit ───────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Chunking settings ────────────────────────────────────────
# How many words per chunk
ingestion.chunk.size=400
# How many words overlap between neighbouring chunks
ingestion.chunk.overlap=50

# Frontend origin allowed to call the admin API.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
