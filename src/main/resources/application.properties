# ── PostgreSQL ──────────────────────────────────────────────
# Use environment variables for anything sensitive before pushing to GitHub.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/college_chatbot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Gufran@21}
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create / update tables from JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

ollama.base.url=http://localhost:11434

ollama.chat.model=gemma3:4b
ollama.embedding.model=nomic-embed-text

app.cors.allowed-origin=http://localhost:5173


# ── ChromaDB ────────────────────────────────────────────────
# ChromaDB runs locally via Docker on port 8000
chromadb.base.url=${CHROMADB_BASE_URL:http://localhost:8000}
chromadb.collection.name=${CHROMADB_COLLECTION_NAME:college_docs}
chromadb.tenant=${CHROMADB_TENANT:default_tenant}
chromadb.database=${CHROMADB_DATABASE:default_database}

# ── File upload size limit ───────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Chunking settings ────────────────────────────────────────
# Smaller chunks = shorter prompts = much faster LLM responses.
# 150 words per chunk is optimal for a FAQ RAG system.
ingestion.chunk.size=150
# Overlap keeps context across chunk boundaries
ingestion.chunk.overlap=20

# Frontend origin allowed to call the admin API.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
